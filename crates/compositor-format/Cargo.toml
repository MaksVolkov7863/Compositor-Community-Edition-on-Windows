[package]
name = "compositor-format"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "File format parsers for .comp, PSD, TIFF, HEIC, PNG and JPEG"

[dependencies]
compositor-core = { path = "../compositor-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zip = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff"] }
thiserror = "1.0"
