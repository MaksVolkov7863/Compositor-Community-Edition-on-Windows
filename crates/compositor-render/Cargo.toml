[package]
name = "compositor-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "SIMD-accelerated blending, Rayon parallel tile engine, and filters for Compositor"

[dependencies]
compositor-core = { path = "../compositor-core" }
rayon = "1.10"
wide = "0.7"
bytemuck = { version = "1.16", features = ["derive"] }
thiserror = "1.0"

[dev-dependencies]
approx = "0.5"
