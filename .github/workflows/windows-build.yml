name: Build Windows Application

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package Windows Application
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: windows
        run: |
          npm install

      - name: Run Windows Test Suite
        working-directory: windows
        run: |
          npm test

      - name: Run Upstream Feature Parity Audit
        run: |
          node scripts/parity-audit.js --ci

      - name: Build Windows Executable & Installer
        working-directory: windows
        run: |
          npm run dist

      - name: Create Portable Zip Archive
        shell: pwsh
        run: |
          Get-ChildItem windows/dist/*.exe | ForEach-Object { Write-Host "Built executable: $($_.FullName)" }
          Compress-Archive -Path "windows/dist/*.exe" -DestinationPath "windows/dist/Compositor-Windows-x64-v1.3.3.zip" -Force

      - name: Upload Windows Binaries Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-Windows-x64
          path: |
            windows/dist/*.exe
            windows/dist/*.zip
          if-no-files-found: warn
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.3.3' }}
          name: Compositor for Windows ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.3.3' }}
          body: |
            ## Compositor for Windows v1.3.3 (Manifest Version 9)
            
            The lightweight, focused Photoshop alternative for Windows 10/11 — fully synchronized with upstream Compositor v1.3.3!
            
            ### What's New in v1.3.3:
            - **Command Palette (Ctrl+F / Ctrl+P)**: Fast fuzzy command finder with keyboard shortcuts execution.
            - **Navigator Minimap**: Interactive thumbnail viewport navigation with 300% zoom activation.
            - **Project File Watcher**: Real-time project file synchronization with SHA-256 digest hashing.
            - **Multi-Tab Document Bar**: Project tabs with dynamic overflow menus and tab navigation.
            - **Color Overlay Layer FX**: Non-destructive layer color overlay tinting with Photoshop blend modes.
            - **Finishing Filters**: Vignette, Sharpen, and Luminous Bloom/Glow filters.
            - **Retro & Pixel Art Filters**: Scanlines CRT simulation and Dithering (Bayer 2x2/4x4/8x8, Floyd-Steinberg, Atkinson).
            - **Free Canvas Rotation & Snapping**: Smooth canvas viewport rotation with 90° angle snapping.
            - **PSB Large Document Import**: 64-bit PSD Large Document format decoding and adjustment layers.
            - **Automated CI Parity Guard**: 100% upstream test suite and API coverage verification (`npm run parity`).
            
            ### Downloads
            - **Compositor Setup (Installer)**: Download `Compositor Setup 1.3.3.exe` below
            - **Compositor Portable**: Download `Compositor 1.3.3.exe` or `Compositor-Windows-x64-v1.3.3.zip` below (no installation required)
          files: |
            windows/dist/*.exe
            windows/dist/*.zip
          draft: false
          prerelease: false

